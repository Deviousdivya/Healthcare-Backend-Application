<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthcare Manager</title>
<style>
  :root {
    --bg: #f4f7fb; --card: #ffffff; --text: #1d2939; --muted: #667085; --line: #e4e7ec;
    --brand: #0e7c86; --brand-dark: #0a5c64; --danger: #d92d20; --ok: #12b76a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; margin: 0; }
  header .who { font-size: 14px; display: flex; gap: 12px; align-items: center; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .auth-wrap { max-width: 420px; margin: 40px auto; }
  h2 { margin: 0 0 14px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 14px; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; background: var(--brand); color: #fff; }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  button.ghost:hover { background: #e6f4f5; }
  button.danger { background: var(--danger); }
  button.small { padding: 5px 10px; font-size: 13px; }
  header button.ghost { color: #fff; border-color: #fff; }
  header button.ghost:hover { background: rgba(255,255,255,.15); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.actions { white-space: nowrap; display: flex; gap: 6px; }
  .empty { color: var(--muted); padding: 14px 0; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; color: #fff; font-size: 14px; display: none; max-width: 360px; }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--danger); }
  .switch { font-size: 14px; margin-top: 14px; color: var(--muted); }
  .switch a { color: var(--brand); cursor: pointer; font-weight: 600; }
  .hidden { display: none !important; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .tag { background: #e6f4f5; color: var(--brand-dark); padding: 2px 8px; border-radius: 99px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Healthcare Manager</h1>
  <div class="who hidden" id="who"><span id="whoName"></span><button class="ghost small" id="logoutBtn">Log out</button></div>
</header>

<main>
  <!-- Login / Register -->
  <section id="authView" class="auth-wrap">
    <div class="card" id="loginCard">
      <h2>Log in</h2>
      <form id="loginForm">
        <label>Email</label><input type="email" name="email" required>
        <label>Password</label><input type="password" name="password" required>
        <p><button type="submit">Log in</button></p>
      </form>
      <div class="switch">No account? <a id="toRegister">Register</a></div>
    </div>
    <div class="card hidden" id="registerCard">
      <h2>Create account</h2>
      <form id="registerForm">
        <label>Name</label><input name="name" required>
        <label>Email</label><input type="email" name="email" required>
        <label>Password</label><input type="password" name="password" required>
        <p><button type="submit">Register</button></p>
      </form>
      <div class="switch">Already registered? <a id="toLogin">Log in</a></div>
    </div>
  </section>

  <!-- App -->
  <section id="appView" class="hidden">
    <div class="tabs">
      <button data-tab="patients" class="active">Patients</button>
      <button data-tab="doctors">Doctors</button>
      <button data-tab="mappings">Assignments</button>
    </div>

    <!-- Patients -->
    <div id="tab-patients">
      <div class="card">
        <h2 id="patientFormTitle">Add patient</h2>
        <form id="patientForm">
          <input type="hidden" name="id">
          <div class="row">
            <div><label>Name</label><input name="name" required></div>
            <div><label>Age</label><input type="number" name="age" min="0" max="150" required></div>
            <div><label>Gender</label>
              <select name="gender" required><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></div>
            <div><label>Phone</label><input name="phone"></div>
          </div>
          <label>Address</label><input name="address">
          <label>Medical history</label><textarea name="medical_history" rows="2"></textarea>
          <p><button type="submit">Save patient</button> <button type="button" class="ghost hidden" id="patientCancel">Cancel edit</button></p>
        </form>
      </div>
      <div class="card"><h2>My patients</h2><div id="patientList"></div></div>
    </div>

    <!-- Doctors -->
    <div id="tab-doctors" class="hidden">
      <div class="card">
        <h2 id="doctorFormTitle">Add doctor</h2>
        <form id="doctorForm">
          <input type="hidden" name="id">
          <div class="row">
            <div><label>Name</label><input name="name" required></div>
            <div><label>Specialization</label><input name="specialization" required></div>
            <div><label>Email</label><input type="email" name="email" required></div>
            <div><label>Phone</label><input name="phone"></div>
            <div><label>Experience (years)</label><input type="number" name="experience_years" min="0" max="70" value="0"></div>
          </div>
          <p><button type="submit">Save doctor</button> <button type="button" class="ghost hidden" id="doctorCancel">Cancel edit</button></p>
        </form>
      </div>
      <div class="card"><h2>All doctors</h2><div id="doctorList"></div></div>
    </div>

    <!-- Mappings -->
    <div id="tab-mappings" class="hidden">
      <div class="card">
        <h2>Assign a doctor to a patient</h2>
        <form id="mappingForm">
          <div class="row">
            <div><label>Patient</label><select name="patient" id="mapPatient" required></select></div>
            <div><label>Doctor</label><select name="doctor" id="mapDoctor" required></select></div>
          </div>
          <p><button type="submit">Assign</button></p>
        </form>
      </div>
      <div class="card">
        <div class="bar"><h2 style="margin:0">Assignments</h2>
          <div><select id="filterPatient"></select></div></div>
        <div id="mappingList"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API = "/api";
const $ = (id) => document.getElementById(id);
let token = null, userId = null, userName = "";
let patients = [], doctors = [];

function store(key, value) { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function toast(msg, ok) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast " + (ok ? "ok" : "err"); t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.style.display = "none"; }, 3500);
}

function esc(value) {
  const d = document.createElement("div"); d.textContent = value == null ? "" : String(value); return d.innerHTML;
}

function errorText(data) {
  if (!data) return "Something went wrong.";
  if (typeof data === "string") return data;
  if (data.detail) return data.detail;
  return Object.entries(data).map(([k, v]) => k + ": " + (Array.isArray(v) ? v.join(" ") : v)).join(" | ");
}

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && token) { logout(); throw new Error("Session expired. Please log in again."); }
  if (!res.ok) throw new Error(errorText(data));
  return data;
}

function formData(form) { return Object.fromEntries(new FormData(form).entries()); }

function parseJwt(t) {
  try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) { return {}; }
}

/* ---------- auth ---------- */
function showApp() {
  $("authView").classList.add("hidden"); $("appView").classList.remove("hidden");
  $("who").classList.remove("hidden"); $("whoName").textContent = userName;
  refreshAll();
}
function logout() {
  token = null; userId = null; store("hc_token", null); store("hc_name", null);
  $("appView").classList.add("hidden"); $("who").classList.add("hidden"); $("authView").classList.remove("hidden");
}
function setSession(access, name) {
  token = access; userId = parseJwt(access).user_id; userName = name;
  store("hc_token", access); store("hc_name", name);
}

$("toRegister").onclick = () => { $("loginCard").classList.add("hidden"); $("registerCard").classList.remove("hidden"); };
$("toLogin").onclick = () => { $("registerCard").classList.add("hidden"); $("loginCard").classList.remove("hidden"); };
$("logoutBtn").onclick = logout;

$("registerForm").onsubmit = async (e) => {
  e.preventDefault();
  const body = formData(e.target);
  try {
    await api("POST", "/auth/register/", body);
    const tokens = await api("POST", "/auth/login/", { email: body.email, password: body.password });
    setSession(tokens.access, body.name); e.target.reset(); toast("Account created. Welcome!", true); showApp();
  } catch (err) { toast(err.message); }
};

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const body = formData(e.target);
  try {
    const tokens = await api("POST", "/auth/login/", body);
    setSession(tokens.access, body.email); e.target.reset(); showApp();
  } catch (err) { toast(err.message === "No active account found with the given credentials" ? "Wrong email or password." : err.message); }
};

/* ---------- tabs ---------- */
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    ["patients", "doctors", "mappings"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
    if (b.dataset.tab === "mappings") loadMappings();
  };
});

async function refreshAll() {
  try {
    await Promise.all([loadPatients(), loadDoctors()]);
    await loadMappings();
  } catch (err) { toast(err.message); }
}

/* ---------- patients ---------- */
const genderLabel = { M: "Male", F: "Female", O: "Other" };

async function loadPatients() {
  patients = await api("GET", "/patients/");
  $("patientList").innerHTML = patients.length
    ? "<table><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>History</th><th></th></tr>" +
      patients.map((p) => `<tr><td>${esc(p.name)}</td><td>${p.age}</td><td>${genderLabel[p.gender]}</td><td>${esc(p.phone)}</td><td>${esc(p.medical_history)}</td>
        <td class="actions"><button class="small ghost" onclick="editPatient(${p.id})">Edit</button><button class="small danger" onclick="deletePatient(${p.id})">Delete</button></td></tr>`).join("") + "</table>"
    : '<div class="empty">No patients yet. Add one above.</div>';
  fillSelect($("mapPatient"), patients, (p) => p.name + " (age " + p.age + ")");
  fillSelect($("filterPatient"), patients, (p) => p.name, "All patients");
}

function resetPatientForm() {
  const f = $("patientForm"); f.reset(); f.elements.id.value = "";
  $("patientFormTitle").textContent = "Add patient"; $("patientCancel").classList.add("hidden");
}
$("patientCancel").onclick = resetPatientForm;

window.editPatient = (id) => {
  const p = patients.find((x) => x.id === id), f = $("patientForm");
  ["id", "name", "age", "gender", "phone", "address", "medical_history"].forEach((k) => { f.elements[k].value = p[k]; });
  $("patientFormTitle").textContent = "Edit patient"; $("patientCancel").classList.remove("hidden"); window.scrollTo(0, 0);
};

window.deletePatient = async (id) => {
  if (!confirm("Delete this patient and their assignments?")) return;
  try { await api("DELETE", "/patients/" + id + "/"); toast("Patient deleted.", true); await loadPatients(); await loadMappings(); }
  catch (err) { toast(err.message); }
};

$("patientForm").onsubmit = async (e) => {
  e.preventDefault();
  const { id, ...body } = formData(e.target);
  body.age = Number(body.age);
  try {
    await (id ? api("PUT", "/patients/" + id + "/", body) : api("POST", "/patients/", body));
    toast(id ? "Patient updated." : "Patient added.", true); resetPatientForm(); await loadPatients();
  } catch (err) { toast(err.message); }
};

/* ---------- doctors ---------- */
async function loadDoctors() {
  doctors = await api("GET", "/doctors/");
  $("doctorList").innerHTML = doctors.length
    ? "<table><tr><th>Name</th><th>Specialization</th><th>Email</th><th>Phone</th><th>Exp.</th><th></th></tr>" +
      doctors.map((d) => `<tr><td>${esc(d.name)}</td><td>${esc(d.specialization)}</td><td>${esc(d.email)}</td><td>${esc(d.phone)}</td><td>${d.experience_years} yrs</td>
        <td class="actions">${d.created_by === userId
          ? `<button class="small ghost" onclick="editDoctor(${d.id})">Edit</button><button class="small danger" onclick="deleteDoctor(${d.id})">Delete</button>`
          : '<span class="tag">read only</span>'}</td></tr>`).join("") + "</table>"
    : '<div class="empty">No doctors yet. Add one above.</div>';
  fillSelect($("mapDoctor"), doctors, (d) => "Dr. " + d.name + " - " + d.specialization);
}

function resetDoctorForm() {
  const f = $("doctorForm"); f.reset(); f.elements.id.value = "";
  $("doctorFormTitle").textContent = "Add doctor"; $("doctorCancel").classList.add("hidden");
}
$("doctorCancel").onclick = resetDoctorForm;

window.editDoctor = (id) => {
  const d = doctors.find((x) => x.id === id), f = $("doctorForm");
  ["id", "name", "specialization", "email", "phone", "experience_years"].forEach((k) => { f.elements[k].value = d[k]; });
  $("doctorFormTitle").textContent = "Edit doctor"; $("doctorCancel").classList.remove("hidden"); window.scrollTo(0, 0);
};

window.deleteDoctor = async (id) => {
  if (!confirm("Delete this doctor and their assignments?")) return;
  try { await api("DELETE", "/doctors/" + id + "/"); toast("Doctor deleted.", true); await loadDoctors(); await loadMappings(); }
  catch (err) { toast(err.message); }
};

$("doctorForm").onsubmit = async (e) => {
  e.preventDefault();
  const { id, ...body } = formData(e.target);
  body.experience_years = Number(body.experience_years || 0);
  try {
    await (id ? api("PUT", "/doctors/" + id + "/", body) : api("POST", "/doctors/", body));
    toast(id ? "Doctor updated." : "Doctor added.", true); resetDoctorForm(); await loadDoctors();
  } catch (err) { toast(err.message); }
};

/* ---------- mappings ---------- */
function fillSelect(select, items, label, allLabel) {
  const prev = select.value;
  select.innerHTML = (allLabel ? `<option value="">${allLabel}</option>` : "") +
    items.map((i) => `<option value="${i.id}">${esc(label(i))}</option>`).join("");
  if ([...select.options].some((o) => o.value === prev)) select.value = prev;
}

async function loadMappings() {
  const pid = $("filterPatient").value;
  const list = pid ? await api("GET", "/mappings/" + pid + "/") : await api("GET", "/mappings/");
  $("mappingList").innerHTML = list.length
    ? "<table><tr><th>Patient</th><th>Doctor</th><th>Specialization</th><th></th></tr>" +
      list.map((m) => `<tr><td>${esc(m.patient_name)}</td><td>Dr. ${esc(m.doctor_details.name)}</td><td>${esc(m.doctor_details.specialization)}</td>
        <td class="actions"><button class="small danger" onclick="deleteMapping(${m.id})">Remove</button></td></tr>`).join("") + "</table>"
    : '<div class="empty">No assignments to show.</div>';
}
$("filterPatient").onchange = () => loadMappings().catch((e) => toast(e.message));

window.deleteMapping = async (id) => {
  if (!confirm("Remove this doctor from the patient?")) return;
  try { await api("DELETE", "/mappings/" + id + "/"); toast("Assignment removed.", true); await loadMappings(); }
  catch (err) { toast(err.message); }
};

$("mappingForm").onsubmit = async (e) => {
  e.preventDefault();
  const body = formData(e.target);
  try {
    await api("POST", "/mappings/", { patient: Number(body.patient), doctor: Number(body.doctor) });
    toast("Doctor assigned.", true); await loadMappings();
  } catch (err) { toast(err.message); }
};

/* ---------- start ---------- */
const saved = load("hc_token");
if (saved) { token = saved; userId = parseJwt(saved).user_id; userName = load("hc_name") || ""; showApp(); }
</script>
</body>
</html>
